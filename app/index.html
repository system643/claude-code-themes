<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambiance</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand" data-tauri-drag-region>
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2.5c.6 3-1.4 4.6-2.8 6.2C7.7 10.4 6.5 12 6.5 14.4A5.5 5.5 0 0 0 12 20a5.5 5.5 0 0 0 5.5-5.6c0-2.2-1-3.7-2-5 .1 1.6-.5 2.7-1.6 3.2.4-3.6-.6-7.3-1.9-10.1Z"/></svg>
          </span>
          <span class="brand-name">Ambiance</span>
        </div>
        <nav class="nav">
          <button class="nav-item" data-view="sessions">
            <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="m7 10 3 2.5L7 15M12.5 15H17"/></svg>
            <span>Sessions</span>
            <span class="badge" id="session-count" hidden></span>
          </button>
          <button class="nav-item" data-view="themes">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="9.5" r="1.3"/><circle cx="14.5" cy="8.5" r="1.3"/><circle cx="16" cy="13" r="1.3"/><path d="M12 20.5a2.5 2.5 0 0 1 0-5h1"/></svg>
            <span>Themes</span>
          </button>
          <button class="nav-item" data-view="discover">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/></svg>
            <span>Discover</span>
          </button>
          <button class="nav-item" data-view="create">
            <svg viewBox="0 0 24 24"><path d="M12 3.5 13.6 8.4 18.5 10 13.6 11.6 12 16.5 10.4 11.6 5.5 10 10.4 8.4Z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8Z"/></svg>
            <span>Create</span>
          </button>
          <button class="nav-item" data-view="projects">
            <svg viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/></svg>
            <span>Projects</span>
          </button>
          <div class="nav-sep"></div>
          <button class="nav-item" data-view="launch">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>
            <span>New session</span>
          </button>
          <button class="nav-item" data-view="settings">
            <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
            <span>Settings</span>
          </button>
        </nav>
        <div class="sidebar-foot" id="plugin-pill"></div>
      </aside>
      <main class="content">
        <header class="toolbar" data-tauri-drag-region>
          <div>
            <h1 id="view-title"></h1>
            <p id="view-subtitle"></p>
          </div>
        </header>
        <section class="view" id="view"></section>
      </main>
    </div>
    <div id="sheet-root"></div>
    <div class="hud" id="hud" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
